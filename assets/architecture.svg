<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Architecture</title>
  <desc id="d">Your PS4 dump is translated to ARM64, runs natively against a replacement system layer, and its GPU commands go through the shadPS4 video core to Vulkan, KosmicKrisp and Metal.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a45"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff8a5c"/></marker>
    <style>
      .box{fill:#161a22;stroke:#2e3646;stroke-width:1.5}
      .hot{fill:#1d1519;stroke:#ff6b4a;stroke-width:2}
      .ext{fill:#12161d;stroke:#3a4256;stroke-width:1.5;stroke-dasharray:6 5}
      .h{font:700 20px -apple-system,Helvetica,Arial,sans-serif;fill:#ffffff}
      .s{font:400 15px -apple-system,Helvetica,Arial,sans-serif;fill:#aab1bf}
      .t{font:600 13px -apple-system,Helvetica,Arial,sans-serif;fill:#ffb347;letter-spacing:1.5px}
      .l{stroke:#ff8a5c;stroke-width:2.2;fill:none}
    </style>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#0e1117"/>

  <text x="40" y="52" class="t">INPUT · NOT IN THIS REPOSITORY</text>
  <rect x="40" y="66" width="320" height="92" rx="14" class="ext"/>
  <text x="62" y="102" class="h">Your PS4 dump</text>
  <text x="62" y="128" class="s">game executable + assets (CUSA01623)</text>

  <path d="M360 112H430" class="l" marker-end="url(#arr)"/>

  <rect x="430" y="66" width="340" height="92" rx="14" class="ext"/>
  <text x="452" y="102" class="h">x86-64 → ARM64 translation</text>
  <text x="452" y="128" class="s">code_NNN.s · guest_image.bin (local)</text>

  <path d="M770 112H840" class="l" marker-end="url(#arr)"/>

  <rect x="840" y="66" width="320" height="92" rx="14" class="box"/>
  <text x="862" y="102" class="h">Peephole optimizer</text>
  <text x="862" y="128" class="s">tools/peephole_guest_code.py</text>

  <path d="M1000 158V196H300V226" class="l" marker-end="url(#arr)"/>

  <text x="40" y="214" class="t">THIS PROJECT</text>
  <rect x="40" y="228" width="520" height="150" rx="14" class="hot"/>
  <text x="62" y="264" class="h">ps4_app  (native arm64)</text>
  <text x="62" y="292" class="s">Guest code runs directly on the CPU, TSO crossing fixup,</text>
  <text x="62" y="314" class="s">job-worker threads and QoS tuning for the 4 P-cores</text>
  <text x="62" y="352" class="s">runtime/core · runtime/kernel</text>

  <path d="M560 303H640" class="l" marker-end="url(#arr)"/>

  <rect x="640" y="228" width="520" height="150" rx="14" class="hot"/>
  <text x="662" y="264" class="h">PS4 system layer  (libSce* modules)</text>
  <text x="662" y="292" class="s">threads · sync · VFS · save data · pad · AJM / ATRAC9</text>
  <text x="662" y="314" class="s">H.264 via FFmpeg · audio out · video out · many stubs</text>
  <text x="662" y="352" class="s">runtime/modules</text>

  <path d="M900 378V420" class="l" marker-end="url(#arr)"/>
  <text x="918" y="404" class="s">GNM / PM4 command buffers</text>

  <rect x="640" y="424" width="520" height="92" rx="14" class="hot"/>
  <text x="662" y="460" class="h">libgow3gpu.dylib</text>
  <text x="662" y="486" class="s">shadPS4 video core: PM4 → GCN shaders → SPIR-V</text>

  <path d="M640 470H560" class="l" marker-end="url(#arr)"/>

  <rect x="40" y="424" width="520" height="92" rx="14" class="box"/>
  <text x="62" y="460" class="h">Vulkan → Mesa KosmicKrisp</text>
  <text x="62" y="486" class="s">patched driver (command BO pool, diagnostics)</text>

  <path d="M300 516V556" class="l" marker-end="url(#arr)"/>

  <rect x="40" y="560" width="1120" height="56" rx="14" class="box"/>
  <text x="62" y="594" class="h">Metal → CAMetalLayer → your display</text>
  <text x="600" y="594" class="s">Metal HUD shows the frame rate · Apple GPU (TBDR)</text>
</svg>
