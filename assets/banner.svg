<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">God of War III Remastered on Apple Silicon</title>
  <desc id="d">Banner: a native ARM64 runtime that translates the PS4 game to Vulkan and Metal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.55" stop-color="#1a1118"/>
      <stop offset="1" stop-color="#3a0f14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a45"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#ff5a45" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5a45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>
  <!-- chip motif -->
  <g transform="translate(985 60)" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.95">
    <rect x="20" y="20" width="160" height="160" rx="22"/>
    <rect x="52" y="52" width="96" height="96" rx="12" stroke-opacity="0.7"/>
    <g stroke-linecap="round" stroke-opacity="0.8">
      <path d="M60 0v20M100 0v20M140 0v20M60 180v20M100 180v20M140 180v20"/>
      <path d="M0 60h20M0 100h20M0 140h20M180 60h20M180 100h20M180 140h20"/>
    </g>
    <text x="100" y="112" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="url(#accent)" stroke="none">ARM64</text>
  </g>
  <text x="64" y="112" font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#c9ced8" letter-spacing="6">GOD OF WAR III REMASTERED</text>
  <text x="62" y="186" font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="#ffffff">Native Apple Silicon</text>
  <rect x="64" y="208" width="180" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="64" y="256" font-family="-apple-system,'SF Pro Text',Helvetica,Arial,sans-serif" font-size="25" fill="#aab1bf">PS4 x86-64 code, translated to ARM64 · GPU via shadPS4 → Vulkan → Metal</text>
  <text x="64" y="292" font-family="-apple-system,'SF Pro Text',Helvetica,Arial,sans-serif" font-size="18" fill="#7b8294">Experimental · no emulator · no Rosetta · no game files included</text>
</svg>
